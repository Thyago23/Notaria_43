# ============================================
# Docker Compose — Desarrollo Local
# Backend + PostgreSQL 14
# ============================================

services:
  db:
    image: postgres:14-alpine
    container_name: notaria43-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notaria43
      POSTGRES_PASSWORD: notaria43pass
      POSTGRES_DB: notaria43
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notaria43"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: notaria43-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://notaria43:notaria43pass@db:5432/notaria43?schema=public"
      JWT_SECRET: "dev-secret-notaria43-cambiar-en-produccion-2024"
      JWT_EXPIRES_IN: "24h"
      PORT: "3000"
      NODE_ENV: "development"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
